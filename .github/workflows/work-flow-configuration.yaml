name: WorkFlowConfiguration

on:
  push:
    branches:
      - "**" # Runs on every branch push
  pull_request:
    branches:
      - main

jobs:
  automated-tests-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.2"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -s -v

      # ========================================================
      # CD STEPS: Only run when code is pushed/merged into main
      # ========================================================

      - name: LogInToAzureContainerRegistry
        if: github.ref == 'refs/heads/main'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: BuildDockerimage
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/weather-pipeline:latest .

      - name: PushDockerimage
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/weather-pipeline:latest
